<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Campus Portal</title>

  <!-- TailwindCSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

   <!-- Font -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="bg-cover bg-center min-h-screen relative" style="background-image: url('image/login.jpg');">

  <!-- Navi Bar -->
  <header class="bg-white bg-opacity-80 backdrop-blur-lg fixed w-full z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
      <div class="flex items-center space-x-2">
        <img src="image/logos.png" alt="Campus Logo" width="100" class="rounded logo-img">
        <span class="font-bold text-2xl text-blue-800">UOM</span>
      </div>

      <nav class="hidden md:flex space-x-8">
        <a href="home.html" class="text-blue-700 hover:text-blue-900 font-semibold">Home</a>
        <a href="about.html" class="text-blue-700 hover:text-blue-900 font-semibold">About</a>
        <a href="contact.html" class="text-blue-700 hover:text-blue-900 font-semibold">Contact</a>
        <a href="course.html" class="text-blue-700 hover:text-blue-900 font-semibold">Courses</a>
        <a href="register.html" class="text-green-700 hover:text-green-900 font-semibold">Register</a>
        <a href="index.html" class="text-blue-700 hover:text-blue-900 font-semibold">Login</a>
      </nav>
    </div>
  </header>

  <!-- Contact -->
  <section class="pt-40 pb-20 px-6">
    <div class="max-w-4xl mx-auto bg-white bg-opacity-90 p-10 rounded-lg shadow-lg backdrop-blur-md">
      <h2 class="text-4xl font-bold text-center text-blue-800 mb-10">Contact Us</h2>
      <form action="#" method="POST" class="space-y-6">
        <div>
          <label class="block mb-2 text-gray-700 font-semibold">Full Name</label>
          <input type="text" name="name" required class="w-full px-4 py-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
          <label class="block mb-2 text-gray-700 font-semibold">Email Address</label>
          <input type="email" name="email" required class="w-full px-4 py-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
          <label class="block mb-2 text-gray-700 font-semibold">Message</label>
          <textarea name="message" rows="5" required class="w-full px-4 py-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
        </div>

        <div class="text-center">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold shadow-md transition-transform transform hover:scale-105">Send Message</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-black bg-opacity-70 text-white py-6 mt-10">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
      
      <p>© 2025 UOM. All rights reserved.</p>

      <div class="flex space-x-6 text-2xl">
        <a href="https://www.facebook.com" target="_blank" class="hover:text-blue-500 transition-colors">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://www.youtube.com" target="_blank" class="hover:text-red-500 transition-colors">
          <i class="fab fa-youtube"></i>
        </a>
        <a href="https://www.instagram.com" target="_blank" class="hover:text-pink-500 transition-colors">
          <i class="fab fa-instagram"></i>
        </a>

        <a href="https://wa.me/yourwhatsappphonenumber" 
        class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-lg transition-transform transform hover:scale-110 z-50"
        target="_blank">
        <i class="fab fa-whatsapp text-3xl"></i>
        </a>

      </div>

    </div>
  </footer>

</body>
</html>
