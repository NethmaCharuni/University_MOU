<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Campus Portal</title>

  <!-- TailwindCSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

   <!-- Font -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="bg-cover bg-center min-h-screen relative" style="background-image: url('image/campus.jpg');">

  <!-- Navi Bar -->
  <header class="bg-white bg-opacity-80 backdrop-blur-lg fixed w-full z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
      <div class="flex items-center space-x-2">
        <img src="image/logos.png" alt="Campus Logo" width="100" class="rounded logo-img">
        <span class="font-bold text-2xl text-blue-800">UOM</span>
      </div>

      <nav class="hidden md:flex space-x-8">
        <a href="home.html" class="text-blue-700 hover:text-blue-900 font-semibold">Home</a>
        <a href="about.html" class="text-blue-700 hover:text-blue-900 font-semibold">About</a>
        <a href="contact.html" class="text-blue-700 hover:text-blue-900 font-semibold">Contact</a>
        <a href="course.html" class="text-blue-700 hover:text-blue-900 font-semibold">Courses</a>
        <a href="register.html" class="text-green-700 hover:text-green-900 font-semibold">Register</a>
        <a href="index.html" class="text-blue-700 hover:text-blue-900 font-semibold">Login</a>
      </nav>
    </div>
  </header>

  <!-- Regi-->
  <section class="flex items-center justify-center pt-40 pb-20 px-6">
    <div class="bg-white bg-opacity-90 backdrop-blur-md p-10 rounded-lg shadow-2xl w-full max-w-md">

      <h2 class="text-3xl font-bold text-center text-blue-800 mb-8">Create an Account</h2>

      <form action="#" method="POST" class="space-y-6">

        <div>
          <label class="block text-gray-700 font-semibold mb-2" for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Your Full Name" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
          <label class="block text-gray-700 font-semibold mb-2" for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
          <label class="block text-gray-700 font-semibold mb-2" for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" placeholder="Your Phone Number" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
          <label class="block text-gray-700 font-semibold mb-2" for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a Password" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-lg transition-transform transform hover:scale-105">
          Register
        </button>

      </form>

      <p class="mt-6 text-center text-gray-700">
        Already have an account?
        <a href="index.html" class="text-blue-600 hover:underline font-semibold">Login Here</a>
      </p>

    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-black bg-opacity-70 text-white py-6 mt-10">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
      
      <p>© 2025 UOM. All rights reserved.</p>

      <div class="flex space-x-6 text-2xl">
        <a href="https://www.facebook.com" target="_blank" class="hover:text-blue-500 transition-colors">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://www.youtube.com" target="_blank" class="hover:text-red-500 transition-colors">
          <i class="fab fa-youtube"></i>
        </a>
        <a href="https://www.instagram.com" target="_blank" class="hover:text-pink-500 transition-colors">
          <i class="fab fa-instagram"></i>
        </a>

        <a href="https://wa.me/yourwhatsappphonenumber" 
        class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-lg transition-transform transform hover:scale-110 z-50"
        target="_blank">
        <i class="fab fa-whatsapp text-3xl"></i>
        </a>

      </div>

    </div>
  </footer>

</body>
</html>
